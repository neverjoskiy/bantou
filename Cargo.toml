[package]
name = "bantou"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"] }
html5ever = "0.27"
markup5ever_rcdom = "0.3"
url = "2"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
slint-build = "1.8"
